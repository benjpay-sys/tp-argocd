# Values du chart argo-rollouts.
# Référence : https://github.com/argoproj/argo-helm/tree/main/charts/argo-rollouts
#
# Étape 5 du poly.

# Active le dashboard Web et l'expose via ingress sur rollouts.devhub.local.
dashboard:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - rollouts.devhub.local
    paths:
      - /
    pathType: Prefix

# Active le service de notifications (étape 10).
# Les URLs webhook sont injectées depuis le Secret `argo-rollouts-notification-secret`
# créé hors-Git (kubectl create secret) pour ne pas exposer les URLs en clair.
notifications:
  secret:
    create: false  # Secret géré manuellement hors-Git

  cm:
    create: true

  notifiers:
    service.webhook.rollout-success: |
      url: http://webhook-receiver.monitoring.svc.cluster.local:8080/rollout/success
      headers:
        - name: Content-Type
          value: application/json
    service.webhook.rollout-failure: |
      url: http://webhook-receiver.monitoring.svc.cluster.local:8080/rollout/failure
      headers:
        - name: Content-Type
          value: application/json

  triggers:
    trigger.on-rollout-completed: |
      - send: [rollout-completed-success]
        when: rollout.status.phase == "Healthy"
    trigger.on-rollout-aborted: |
      - send: [rollout-completed-failure]
        when: rollout.status.phase == "Degraded"

  templates:
    template.rollout-completed-success: |
      webhook:
        rollout-success:
          method: POST
          body: |
            {
              "event": "Promoted",
              "rollout": "{{ "{{" }} .rollout.metadata.name {{ "}}" }}",
              "namespace": "{{ "{{" }} .rollout.metadata.namespace {{ "}}" }}",
              "stable": "{{ "{{" }} .rollout.status.stableRS {{ "}}" }}",
              "duration": "{{ "{{" }} duration .rollout.status.observedGeneration {{ "}}" }}"
            }
    template.rollout-completed-failure: |
      webhook:
        rollout-failure:
          method: POST
          body: |
            {
              "event": "Aborted",
              "rollout": "{{ "{{" }} .rollout.metadata.name {{ "}}" }}",
              "namespace": "{{ "{{" }} .rollout.metadata.namespace {{ "}}" }}",
              "message": "{{ "{{" }} .rollout.status.message {{ "}}" }}"
            }

# En kind, gardez les ressources légères.
controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
