# Values du chart kube-prometheus-stack pour le TP 3.
# Référence : https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Ce fichier est volontairement minimaliste. Tweakez-le étape 3.

fullnameOverride: kps

# ---- Grafana ----
grafana:
  enabled: true
  # Mot de passe admin lu depuis un Secret créé hors-Git (kubectl create secret).
  # Ne JAMAIS mettre de mot de passe en clair dans ce fichier versionné.
  # Commande de création (à lancer une seule fois sur le cluster) :
  #   kubectl create secret generic grafana-admin-secret \
  #     --from-literal=admin-password='<votre-mot-de-passe>' \
  #     -n monitoring
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  ingress:
    enabled: true
    ingressClassName: nginx
    # TODO : alignez avec l'entrée que vous mettrez dans /etc/hosts.
    hosts:
      - grafana.devhub.local
    path: /
  # Auto-discovery des dashboards posés en ConfigMap avec le label `grafana_dashboard=1`.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

# ---- Prometheus ----
prometheus:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    # TODO : alignez avec l'entrée que vous mettrez dans /etc/hosts.
    hosts:
      - prometheus.devhub.local
    paths:
      - /
  prometheusSpec:
    # Rétention courte pour le TP — adaptez si vous gardez le cluster longtemps.
    retention: 15d
    # En kind 2 nœuds, EmptyDir est suffisant. En prod : PVC.
    # TODO étape 3 (défi) : passez en PersistentVolumeClaim.
    storageSpec: {}
    # Sélectionne TOUS les ServiceMonitor portant le label `release: kps`,
    # quel que soit leur namespace. C'est l'option la plus permissive,
    # utile en TP.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kps
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        release: kps

# ---- Alertmanager ----
alertmanager:
  enabled: true
  config:
    global:
      # Résolution d'une alerte considérée résolue si elle n'est plus firing
      # pendant ce délai. 5 min est une bonne valeur pour le TP.
      resolve_timeout: 5m

    route:
      # Regrouper les alertes par service et namespace pour éviter le flood.
      group_by: ["alertname", "service", "namespace"]
      # Attendre 30 s avant d'envoyer le premier groupe d'alertes.
      group_wait: 30s
      # Attendre 5 min avant d'envoyer un nouveau groupe pour le même groupe.
      group_interval: 5m
      # Renvoyer l'alerte toutes les 4 h si elle reste firing.
      repeat_interval: 4h
      # Receiver par défaut (blackhole — les alertes sans route atterrissent ici)
      receiver: blackhole
      routes:
        # Alertes critiques → page (réveille)
        - matchers:
            - name: severity
              value: page
          receiver: webhook-page
          group_wait: 10s
          repeat_interval: 1h
        # Alertes non critiques → ticket (attend lundi)
        - matchers:
            - name: severity
              value: ticket
          receiver: webhook-ticket
          group_wait: 1m
          repeat_interval: 12h

    receivers:
      - name: blackhole

      # Webhooks en-cluster (pod webhook-receiver/monitoring) — voir kubectl logs webhook-receiver -n monitoring
      # En prod : remplacer par des URLs webhook.site ou Slack/PagerDuty réels.
      - name: webhook-page
        webhook_configs:
          - url: "http://webhook-receiver.monitoring.svc.cluster.local:8080/page"
            send_resolved: true

      - name: webhook-ticket
        webhook_configs:
          - url: "http://webhook-receiver.monitoring.svc.cluster.local:8080/ticket"
            send_resolved: true

    inhibit_rules:
      # Une alerte `page` inhibe une alerte `ticket` sur le même service
      # pour éviter le double bruit.
      - source_matchers:
          - name: severity
            value: page
        target_matchers:
          - name: severity
            value: ticket
        equal: ["service", "namespace"]

# ---- Sous-charts à désactiver sur kind ----
# Kind ne fournit pas les endpoints standards de la control plane.
# Laissez à false sinon Prometheus aura des cibles DOWN en permanence.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# ---- Operator ----
prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    patch:
      enabled: false
    enabled: false
