# AppProject ArgoCD : `devhub` (élargi pour le TP 3)
#
# Reprise de l'AppProject du TP 2 avec un cercle de destinations élargi :
#   - les namespaces applicatifs (devhub-*)
#   - le namespace monitoring (kube-prometheus-stack)
#   - le namespace argo-rollouts (contrôleur Argo Rollouts)
#
# Référence : https://argo-cd.readthedocs.io/en/stable/operator-manual/project-management/

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devhub
  namespace: argocd
spec:
  description: Plateforme DevHub Campus SRE (TP 3)

  sourceRepos:
    - https://github.com/benjpay-sys/tp-argocd.git
    - https://prometheus-community.github.io/helm-charts
    - https://argoproj.github.io/argo-helm

  destinations:
    - server: https://kubernetes.default.svc
      namespace: devhub-*
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: policy
      kind: PodSecurityPolicy
    - group: storage.k8s.io
      kind: StorageClass

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
