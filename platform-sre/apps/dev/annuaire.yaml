# Application ArgoCD : annuaire-dev
#
# Déploie le chart Helm de services/annuaire/chart dans le namespace devhub-dev.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: annuaire-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devhub

  source:
    # TODO : URL de votre fork.
    repoURL: https://github.com/benjpay-sys/tp-argocd.git
    # TODO : alignez sur la même révision que la root Application.
    targetRevision: tp3
    path: services/annuaire/chart
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devhub-dev

  # Argo Rollouts doit injecter rollout-pod-template-hash dans spec.selector
  # des services canary/stable. SSA bloquerait cette injection — on cède la
  # propriété du sélecteur au rollouts-controller.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: annuaire-dev-annuaire-canary
      namespace: devhub-dev
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: annuaire-dev-annuaire-stable
      namespace: devhub-dev
      jsonPointers:
        - /spec/selector

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
