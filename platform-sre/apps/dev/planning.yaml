# Application ArgoCD : planning-dev
#
# Déploie le chart Helm de services/planning/chart dans le namespace devhub-dev.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planning-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devhub

  source:
    # TODO : URL de votre fork.
    repoURL: https://github.com/benjpay-sys/tp-argocd.git
    targetRevision: tp3
    path: services/planning/chart
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devhub-dev

  # ArgoCD SSA owning spec.selector conflicts with Argo Rollouts injecting
  # rollout-pod-template-hash into the active/preview service selectors.
  # These ignoreDifferences entries let the Rollout controller own the selector.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: planning-dev-planning-active
      namespace: devhub-dev
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: planning-dev-planning-preview
      namespace: devhub-dev
      jsonPointers:
        - /spec/selector

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
