# ApplicationSet preview pour planning.
# Une fois annuaire-preview.yaml fait, dupliquez en adaptant.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: planning-preview
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - branch: main
            branch_slug: feature-demo-prof
  template:
    metadata:
      name: planning-preview-{{branch_slug}}
      labels:
        devhub.io/env: preview
        devhub.io/service: planning
    spec:
      project: devhub
      source:
        repoURL: http://local-git-server.argocd.svc/git/devhub-campus.git
        targetRevision: '{{branch}}'
        path: services/planning/chart
        helm:
          valueFiles:
            - values-preview.yaml
          parameters:
            - name: ingress.host
              value: planning-{{branch_slug}}.devhub.local
      destination:
        server: https://kubernetes.default.svc
        namespace: devhub-preview-{{branch_slug}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
