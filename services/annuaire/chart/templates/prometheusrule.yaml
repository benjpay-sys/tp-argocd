{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "annuaire.fullname" . }}
  labels:
    {{- include "annuaire.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.serviceMonitor.release | quote }}
spec:
  groups:
    - name: {{ include "annuaire.fullname" . }}.availability
      interval: 30s
      rules:
        # Alerte critique : taux d'erreur 5xx > 1 % sur 5 min → réveille l'astreinte
        - alert: AnnuaireHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="{{ .Release.Namespace }}",
                service="{{ include "annuaire.fullname" . }}-stable",
                status_class="5xx"
              }[5m]))
              /
              sum(rate(http_requests_total{
                namespace="{{ .Release.Namespace }}",
                service="{{ include "annuaire.fullname" . }}-stable"
              }[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: page
            service: annuaire
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: "Annuaire : taux d'erreur > 1 %"
            description: >
              Le taux de réponses 5xx sur annuaire dépasse 1 % depuis 5 minutes
              (valeur actuelle : {{ "{{" }} $value | humanizePercentage {{ "}}" }}).
            runbook_url: "https://github.com/benjpay-sys/tp-argocd/blob/tp3/docs/runbooks/annuaire-high-error-rate.md"

        # Alerte ticket : latence p95 dégradée sur 30 min → peut attendre lundi
        - alert: AnnuaireHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{
                namespace="{{ .Release.Namespace }}",
                service="{{ include "annuaire.fullname" . }}-stable"
              }[5m])) by (le)
            ) > 0.3
          for: 30m
          labels:
            severity: ticket
            service: annuaire
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: "Annuaire : latence p95 > 300 ms"
            description: >
              La latence p95 sur annuaire dépasse 300 ms depuis 30 minutes
              (valeur actuelle : {{ "{{" }} $value | humanizeDuration {{ "}}" }}).
            runbook_url: "https://github.com/benjpay-sys/tp-argocd/blob/tp3/docs/runbooks/annuaire-high-latency.md"
{{- end }}
